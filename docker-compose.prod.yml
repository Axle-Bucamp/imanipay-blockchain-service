# ImaniPay Blockchain Service - Production Environment
# This file extends the base configuration for production deployment

version: '3.8'

services:
  # ========================================================================
  # API Service - Production Configuration
  # ========================================================================
  api:
    image: imanipay-blockchain-service:${VERSION:-latest}
    deploy:
      replicas: 3
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        monitor: 60s
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - LOG_LEVEL=WARNING
      - UVICORN_WORKERS=4
      - DATABASE_POOL_SIZE=20
      - DATABASE_MAX_OVERFLOW=30
      - REDIS_POOL_SIZE=20
    env_file:
      - .env.production
    volumes:
      - prod_logs:/app/logs:rw
      - prod_data:/app/data:rw
    networks:
      - imanipay-prod-network
      - imanipay-db-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api-prod.rule=Host(`api.imanipay.com`)"
      - "traefik.http.routers.api-prod.tls=true"
      - "traefik.http.routers.api-prod.tls.certresolver=letsencrypt"
      - "traefik.http.services.api-prod.loadbalancer.server.port=8000"
      - "traefik.http.middlewares.api-rate-limit.ratelimit.burst=100"

  # ========================================================================
  # PostgreSQL - Production Configuration
  # ========================================================================
  postgres:
    image: postgres:15-alpine
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./scripts/prod-init.sql:/docker-entrypoint-initdb.d/prod-init.sql:ro
      - ./scripts/postgres-prod.conf:/etc/postgresql/postgresql.conf:ro
      - postgres_backups:/backups
    networks:
      - imanipay-db-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    command: >
      postgres
      -c config_file=/etc/postgresql/postgresql.conf
      -c shared_preload_libraries=pg_stat_statements
      -c max_connections=200
      -c shared_buffers=1GB
      -c effective_cache_size=3GB
      -c maintenance_work_mem=256MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100

  # ========================================================================
  # Redis - Production Configuration
  # ========================================================================
  redis:
    image: redis:7-alpine
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - redis_prod_data:/data
      - ./scripts/redis-prod.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - imanipay-db-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command: >
      redis-server /usr/local/etc/redis/redis.conf
      --appendonly yes
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 1gb
      --maxmemory-policy allkeys-lru

  # ========================================================================
  # NGINX - Production Load Balancer
  # ========================================================================
  nginx:
    image: nginx:alpine
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/prod-nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_prod_logs:/var/log/nginx
    depends_on:
      - api
    networks:
      - imanipay-prod-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nginx-prod.rule=Host(`imanipay.com`)"
      - "traefik.http.routers.nginx-prod.tls=true"
      - "traefik.http.routers.nginx-prod.tls.certresolver=letsencrypt"

  # ========================================================================
  # Monitoring Stack
  # ========================================================================
  
  # Prometheus
  prometheus:
    image: prom/prometheus:latest
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
    volumes:
      - ./monitoring/prometheus-prod.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_prod_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    networks:
      - imanipay-monitoring-network
      - imanipay-prod-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Grafana
  grafana:
    image: grafana/grafana:latest
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_prod_data:/var/lib/grafana
      - ./monitoring/grafana/prod-dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/prod-datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    networks:
      - imanipay-monitoring-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana-prod.rule=Host(`monitoring.imanipay.com`)"
      - "traefik.http.routers.grafana-prod.tls=true"
      - "traefik.http.routers.grafana-prod.tls.certresolver=letsencrypt"

  # ========================================================================
  # Backup Service
  # ========================================================================
  backup:
    image: postgres:15-alpine
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - BACKUP_SCHEDULE=0 2 * * *  # Daily at 2 AM
    volumes:
      - postgres_backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    networks:
      - imanipay-db-network
    command: >
      sh -c "
        apk add --no-cache dcron &&
        echo '${BACKUP_SCHEDULE} /backup.sh' | crontab - &&
        crond -f
      "

# ========================================================================
# Production Networks
# ========================================================================
networks:
  imanipay-prod-network:
    driver: overlay
    attachable: true
    ipam:
      config:
        - subnet: 10.0.1.0/24
  
  imanipay-db-network:
    driver: overlay
    internal: true
    ipam:
      config:
        - subnet: 10.0.2.0/24
  
  imanipay-monitoring-network:
    driver: overlay
    ipam:
      config:
        - subnet: 10.0.3.0/24

# ========================================================================
# Production Volumes
# ========================================================================
volumes:
  postgres_prod_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/imanipay/data/postgres
  
  redis_prod_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/imanipay/data/redis
  
  prod_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/imanipay/logs/api
  
  prod_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/imanipay/data/api
  
  nginx_prod_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/imanipay/logs/nginx
  
  prometheus_prod_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/imanipay/data/prometheus
  
  grafana_prod_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/imanipay/data/grafana
  
  postgres_backups:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/imanipay/backups/postgres

# ========================================================================
# Production Usage:
# ========================================================================
#
# Deploy to production:
# docker stack deploy -c docker-compose.prod.yml imanipay
#
# Scale API service:
# docker service scale imanipay_api=5
#
# View service logs:
# docker service logs -f imanipay_api
#
# Update service:
# docker service update --image imanipay-blockchain-service:v1.1.0 imanipay_api
#
# Remove stack:
# docker stack rm imanipay
#
# Monitor services:
# docker service ls
# docker service ps imanipay_api
#
# ========================================================================

