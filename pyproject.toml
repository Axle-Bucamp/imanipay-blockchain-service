[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "imanipay-blockchain-service"
version = "1.0.0"
description = "ImaniPay Blockchain Service - Cross-border payment platform for Africa"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "ImaniPay Team", email = "dev@imanipay.com"}
]
maintainers = [
    {name = "ImaniPay Team", email = "dev@imanipay.com"}
]
keywords = [
    "blockchain", "payments", "algorand", "africa", "cross-border",
    "fintech", "cryptocurrency", "usdc", "remittance"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Office/Business :: Financial",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy[asyncio]>=2.0.23",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "redis[hiredis]>=5.0.1",
    "pydantic[email]>=2.5.0",
    "pydantic-settings>=2.1.0",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.6",
    "httpx>=0.25.2",
    "aiofiles>=23.2.1",
    "cryptography>=41.0.7",
    "py-algorand-sdk>=2.4.0",
    "qrcode[pil]>=7.4.2",
    "pyotp>=2.9.0",
    "phonenumbers>=8.13.26",
    "babel>=2.13.1",
    "python-dateutil>=2.8.2",
    "pytz>=2023.3.post1",
    "structlog>=23.2.0",
    "prometheus-client>=0.19.0",
    "opentelemetry-api>=1.21.0",
    "opentelemetry-sdk>=1.21.0",
    "opentelemetry-instrumentation-fastapi>=0.42b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.42b0",
    "opentelemetry-instrumentation-redis>=0.42b0",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "black>=23.11.0",
    "isort>=5.12.0",
    "flake8>=6.1.0",
    "mypy>=1.7.1",
    "bandit>=1.7.5",
    "safety>=2.3.5",
    "pre-commit>=3.6.0",
]
docs = [
    "sphinx>=7.2.6",
    "sphinx-rtd-theme>=1.3.0",
    "sphinx-autodoc-typehints>=1.25.2",
    "myst-parser>=2.0.0",
]
test = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "httpx>=0.25.2",
    "factory-boy>=3.3.0",
    "faker>=20.1.0",
    "freezegun>=1.2.2",
]

[project.urls]
Homepage = "https://github.com/imanipay-africa/imanipay-blockchain-service"
Documentation = "https://imanipay-blockchain-service.readthedocs.io/"
Repository = "https://github.com/imanipay-africa/imanipay-blockchain-service.git"
"Bug Tracker" = "https://github.com/imanipay-africa/imanipay-blockchain-service/issues"
Changelog = "https://github.com/imanipay-africa/imanipay-blockchain-service/blob/main/CHANGELOG.md"

[project.scripts]
imanipay-server = "app.main:main"

# ========================================================================
# Tool Configuration
# ========================================================================

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
app = ["py.typed"]

# ========================================================================
# Black Configuration
# ========================================================================
[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | env
  | _build
  | buck-out
  | build
  | dist
  | migrations
)/
'''

# ========================================================================
# isort Configuration
# ========================================================================
[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
known_first_party = ["app"]
known_third_party = [
    "fastapi", "sqlalchemy", "pydantic", "redis", "algorand",
    "cryptography", "passlib", "jose", "httpx", "pytest"
]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]

# ========================================================================
# mypy Configuration
# ========================================================================
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true
show_column_numbers = true
show_error_context = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "algorand.*",
    "py_algorand_sdk.*",
    "pyotp.*",
    "qrcode.*",
    "phonenumbers.*",
    "babel.*",
    "structlog.*",
    "prometheus_client.*",
    "opentelemetry.*",
]
ignore_missing_imports = true

# ========================================================================
# pytest Configuration
# ========================================================================
[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=80",
    "--asyncio-mode=auto",
]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Slow tests",
    "security: Security tests",
    "performance: Performance tests",
    "blockchain: Blockchain-related tests",
    "payment: Payment-related tests",
    "auth: Authentication tests",
    "api: API tests",
    "database: Database tests",
    "redis: Redis tests",
    "external: Tests requiring external services",
]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
env = [
    "ENVIRONMENT=testing",
    "DATABASE_URL=postgresql://testuser:testpass@localhost:5432/testdb",
    "REDIS_URL=redis://localhost:6379/0",
    "JWT_SECRET_KEY=test-secret-key",
    "ENCRYPTION_KEY=test-encryption-key-32-chars-long",
]

# ========================================================================
# Coverage Configuration
# ========================================================================
[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/env/*",
    "app/main.py",
]
branch = true
parallel = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
    "TYPE_CHECKING",
]
show_missing = true
skip_covered = false
precision = 2

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

# ========================================================================
# bandit Configuration
# ========================================================================
[tool.bandit]
exclude_dirs = ["tests", "migrations"]
skips = ["B101", "B601"]  # Skip assert_used and shell_injection_process

[tool.bandit.assert_used]
skips = ["*_test.py", "test_*.py"]

# ========================================================================
# flake8 Configuration (in setup.cfg since flake8 doesn't support pyproject.toml)
# ========================================================================

# ========================================================================
# Commitizen Configuration
# ========================================================================
[tool.commitizen]
name = "cz_conventional_commits"
version = "1.0.0"
tag_format = "v$version"
version_files = [
    "pyproject.toml:version",
    "app/__init__.py:__version__",
]
bump_message = "bump: version $current_version → $new_version"
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"
changelog_format = "## $version ($date)"

# ========================================================================
# Vulture Configuration
# ========================================================================
[tool.vulture]
min_confidence = 80
paths = ["app", "tests"]
exclude = ["migrations/"]
ignore_decorators = ["@app.route", "@router.get", "@router.post", "@router.put", "@router.delete"]
ignore_names = ["_*", "test_*", "*_test"]

# ========================================================================
# Ruff Configuration (Alternative to flake8)
# ========================================================================
[tool.ruff]
target-version = "py311"
line-length = 100
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "S",  # bandit
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "S104",  # hardcoded bind all interfaces
    "S108",  # probable insecure usage of temp file/directory
]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "migrations",
]

[tool.ruff.per-file-ignores]
"tests/*" = ["S101", "S106", "S311"]  # Allow assert, hardcoded passwords in tests
"app/core/config.py" = ["S105", "S106"]  # Allow hardcoded passwords in config

[tool.ruff.mccabe]
max-complexity = 10

[tool.ruff.isort]
known-first-party = ["app"]

# ========================================================================
# Pylint Configuration
# ========================================================================
[tool.pylint.messages_control]
disable = [
    "C0103",  # invalid-name
    "C0114",  # missing-module-docstring
    "C0115",  # missing-class-docstring
    "C0116",  # missing-function-docstring
    "R0903",  # too-few-public-methods
    "R0913",  # too-many-arguments
    "W0613",  # unused-argument
]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.design]
max-args = 10
max-locals = 20
max-returns = 6
max-branches = 15
max-statements = 50
max-parents = 7
max-attributes = 15
min-public-methods = 1
max-public-methods = 25

# ========================================================================
# Semantic Release Configuration
# ========================================================================
[tool.semantic_release]
version_variable = [
    "pyproject.toml:version",
    "app/__init__.py:__version__",
]
branch = "main"
changelog_file = "CHANGELOG.md"
build_command = "pip install build && python -m build"
dist_path = "dist/"
upload_to_pypi = false
upload_to_release = true
remove_dist = false
patch_without_tag = true

[tool.semantic_release.changelog]
template_dir = "templates"
changelog_file = "CHANGELOG.md"
exclude_commit_patterns = [
    "^docs:",
    "^test:",
    "^ci:",
    "^chore:",
    "^style:",
    "^refactor:",
]

# ========================================================================
# Interrogate Configuration (Docstring Coverage)
# ========================================================================
[tool.interrogate]
ignore-init-method = true
ignore-init-module = false
ignore-magic = false
ignore-semiprivate = false
ignore-private = false
ignore-property-decorators = false
ignore-module = false
ignore-nested-functions = false
ignore-nested-classes = true
ignore-setters = false
fail-under = 80
exclude = ["setup.py", "docs", "build", "migrations"]
ignore-regex = ["^get$", "^mock_.*", ".*BaseClass.*"]
verbose = 0
quiet = false
whitelist-regex = []
color = true
omit-covered-files = false

# ========================================================================
# Radon Configuration (Code Complexity)
# ========================================================================
[tool.radon]
cc_min = "B"
mi_min = "B"

