[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "imanipay-blockchain-service"
version = "2.0.0"
description = "Blockchain-focused service for Algorand smart contracts and wallet operations"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "ImaniPay Team", email = "dev@imanipay.com" }
]
keywords = [
    "blockchain",
    "algorand", 
    "smart-contracts",
    "cryptocurrency",
    "fintech",
    "payments"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    # Core FastAPI and ASGI
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    
    # Algorand SDK and Smart Contracts
    "py-algorand-sdk>=2.6.0",
    "pyteal>=0.25.0",
    
    # Database and ORM (Simplified)
    "sqlalchemy>=2.0.23",
    "alembic>=1.12.1",
    "asyncpg>=0.29.0",
    
    # Data Validation (Pydantic v2)
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    
    # HTTP Client
    "httpx>=0.25.2",
    
    # Environment and Configuration
    "python-dotenv>=1.0.0",
    
    # Rate Limiting
    "slowapi>=0.1.9",
    
    # Logging
    "structlog>=23.2.0",
    "rich>=13.7.0",
    
    # Utilities
    "python-dateutil>=2.8.2",
    "click>=8.1.7",
    
    # Basic Security
    "cryptography>=41.0.8",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "pytest-cov>=4.1.0",
    
    # Code Quality
    "black>=23.11.0",
    "isort>=5.12.0",
    "ruff>=0.1.6",
    "mypy>=1.7.1",
    "pre-commit>=3.6.0",
]

algokit = [
    # AlgoKit integration
    "algokit-utils>=2.0.0",
    "algosdk>=2.6.0",
]

[project.urls]
Homepage = "https://github.com/imanipay-africa/imanipay-blockchain-service"
Repository = "https://github.com/imanipay-africa/imanipay-blockchain-service.git"
Issues = "https://github.com/imanipay-africa/imanipay-blockchain-service/issues"

[project.scripts]
imanipay-server = "main:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "pytest-cov>=4.1.0",
    "black>=23.11.0",
    "isort>=5.12.0",
    "ruff>=0.1.6",
    "mypy>=1.7.1",
    "pre-commit>=3.6.0",
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["app"]

[tool.ruff]
target-version = "py311"
line-length = 88
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "algosdk.*",
    "pyteal.*",
    "slowapi.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=app",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html",
]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "blockchain: marks tests as blockchain tests",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

