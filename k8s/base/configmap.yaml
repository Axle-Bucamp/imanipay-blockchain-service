# ImaniPay Blockchain Service - ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: imanipay-config
  namespace: imanipay
  labels:
    app.kubernetes.io/name: imanipay-blockchain-service
    app.kubernetes.io/component: config
    app.kubernetes.io/part-of: imanipay-platform
data:
  # Application Configuration
  APP_NAME: "ImaniPay Blockchain Service"
  APP_VERSION: "1.0.0"
  ENVIRONMENT: "production"
  DEBUG: "false"
  LOG_LEVEL: "INFO"
  
  # Server Configuration
  PORT: "8000"
  UVICORN_WORKERS: "4"
  UVICORN_WORKER_CLASS: "uvicorn.workers.UvicornWorker"
  
  # Database Configuration
  DATABASE_POOL_SIZE: "20"
  DATABASE_MAX_OVERFLOW: "30"
  DATABASE_POOL_TIMEOUT: "30"
  DATABASE_POOL_RECYCLE: "3600"
  
  # Redis Configuration
  REDIS_POOL_SIZE: "20"
  REDIS_POOL_TIMEOUT: "10"
  REDIS_SOCKET_KEEPALIVE: "true"
  REDIS_SOCKET_KEEPALIVE_OPTIONS: "1,3,5"
  
  # Security Configuration
  JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "15"
  JWT_REFRESH_TOKEN_EXPIRE_DAYS: "7"
  JWT_ALGORITHM: "HS256"
  
  # Rate Limiting
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_PER_MINUTE: "100"
  RATE_LIMIT_BURST: "200"
  
  # Monitoring Configuration
  PROMETHEUS_ENABLED: "true"
  PROMETHEUS_PORT: "9090"
  OPENTELEMETRY_ENABLED: "true"
  HEALTH_CHECK_ENABLED: "true"
  
  # External Services
  ALGORAND_NETWORK: "mainnet"
  ALGORAND_NODE_URL: "https://mainnet-api.algonode.cloud"
  ALGORAND_INDEXER_URL: "https://mainnet-idx.algonode.cloud"
  
  # Feature Flags
  FEATURE_CROSS_BORDER_PAYMENTS: "true"
  FEATURE_MULTI_CURRENCY: "true"
  FEATURE_SMART_CONTRACTS: "true"
  FEATURE_COMPLIANCE_CHECKS: "true"

---
# NGINX Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: imanipay
  labels:
    app.kubernetes.io/name: nginx
    app.kubernetes.io/component: config
    app.kubernetes.io/part-of: imanipay-platform
data:
  nginx.conf: |
    user nginx;
    worker_processes auto;
    error_log /var/log/nginx/error.log warn;
    pid /var/run/nginx.pid;

    events {
        worker_connections 1024;
        use epoll;
        multi_accept on;
    }

    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;
        
        server_tokens off;
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 65;
        
        # Logging
        log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for"';
        access_log /var/log/nginx/access.log main;
        
        # Gzip
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
        
        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        
        # Upstream
        upstream api_backend {
            server imanipay-api-service:8000;
        }
        
        # Server
        server {
            listen 80;
            server_name _;
            
            location /health {
                access_log off;
                proxy_pass http://api_backend;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }
            
            location / {
                proxy_pass http://api_backend;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_connect_timeout 30s;
                proxy_send_timeout 30s;
                proxy_read_timeout 30s;
            }
        }
    }

