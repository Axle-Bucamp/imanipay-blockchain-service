# ImaniPay Blockchain Service - Secrets
# Note: In production, use external secret management systems like:
# - AWS Secrets Manager
# - Azure Key Vault
# - Google Secret Manager
# - HashiCorp Vault
# - Kubernetes External Secrets Operator

apiVersion: v1
kind: Secret
metadata:
  name: imanipay-secrets
  namespace: imanipay
  labels:
    app.kubernetes.io/name: imanipay-blockchain-service
    app.kubernetes.io/component: secrets
    app.kubernetes.io/part-of: imanipay-platform
  annotations:
    description: "Sensitive configuration for ImaniPay Blockchain Service"
type: Opaque
data:
  # Database Configuration (Base64 encoded)
  # Replace with actual values encoded in base64
  DATABASE_URL: cG9zdGdyZXNxbDovL3VzZXI6cGFzc3dvcmRAaG9zdDo1NDMyL2RiX25hbWU=
  
  # Security Keys (Base64 encoded)
  # Generate strong keys and encode them
  JWT_SECRET_KEY: eW91ci1zdXBlci1zZWNyZXQtand0LWtleS1oZXJl
  ENCRYPTION_KEY: eW91ci0zMi1jaGFyYWN0ZXItZW5jcnlwdGlvbi1rZXk=
  
  # Redis Configuration (Base64 encoded)
  REDIS_URL: cmVkaXM6Ly86cGFzc3dvcmRAcmVkaXM6NjM3OS8w
  REDIS_PASSWORD: cmVkaXMtcGFzc3dvcmQ=
  
  # External Service API Keys (Base64 encoded)
  CIRCLE_API_KEY: Y2lyY2xlLWFwaS1rZXktaGVyZQ==
  YELLOWCARD_API_KEY: eWVsbG93Y2FyZC1hcGkta2V5LWhlcmU=
  TRANSAK_API_KEY: dHJhbnNhay1hcGkta2V5LWhlcmU=
  COINBASE_API_KEY: Y29pbmJhc2UtYXBpLWtleS1oZXJl
  
  # Communication Services (Base64 encoded)
  SENDGRID_API_KEY: c2VuZGdyaWQtYXBpLWtleS1oZXJl
  TWILIO_ACCOUNT_SID: dHdpbGlvLWFjY291bnQtc2lkLWhlcmU=
  TWILIO_AUTH_TOKEN: dHdpbGlvLWF1dGgtdG9rZW4taGVyZQ==
  
  # Monitoring and Observability (Base64 encoded)
  SENTRY_DSN: c2VudHJ5LWRzbi1oZXJl
  DATADOG_API_KEY: ZGF0YWRvZy1hcGkta2V5LWhlcmU=
  
  # Exchange Rate Services (Base64 encoded)
  EXCHANGE_RATE_API_KEY: ZXhjaGFuZ2UtcmF0ZS1hcGkta2V5LWhlcmU=

---
# Database Secrets
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secrets
  namespace: imanipay
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: imanipay-platform
type: Opaque
data:
  # PostgreSQL Configuration (Base64 encoded)
  POSTGRES_DB: aW1hbmlwYXlfcHJvZA==
  POSTGRES_USER: aW1hbmlwYXlfdXNlcg==
  POSTGRES_PASSWORD: c3VwZXItc2VjdXJlLXBhc3N3b3Jk
  POSTGRES_REPLICATION_USER: cmVwbGljYXRvcg==
  POSTGRES_REPLICATION_PASSWORD: cmVwbGljYXRpb24tcGFzc3dvcmQ=

---
# Redis Secrets
apiVersion: v1
kind: Secret
metadata:
  name: redis-secrets
  namespace: imanipay
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: imanipay-platform
type: Opaque
data:
  # Redis Configuration (Base64 encoded)
  REDIS_PASSWORD: cmVkaXMtc3VwZXItc2VjdXJlLXBhc3N3b3Jk

---
# TLS Certificates (if not using cert-manager)
apiVersion: v1
kind: Secret
metadata:
  name: tls-certificates
  namespace: imanipay
  labels:
    app.kubernetes.io/name: tls
    app.kubernetes.io/component: certificates
    app.kubernetes.io/part-of: imanipay-platform
type: kubernetes.io/tls
data:
  # TLS Certificate and Key (Base64 encoded)
  # Replace with actual certificate and key
  tls.crt: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0t...
  tls.key: LS0tLS1CRUdJTiBQUklWQVRFIEtFWS0tLS0t...

---
# Instructions for generating secrets:
#
# 1. Generate JWT Secret Key:
#    openssl rand -base64 32 | base64 -w 0
#
# 2. Generate Encryption Key:
#    openssl rand -base64 32 | base64 -w 0
#
# 3. Encode database URL:
#    echo -n "postgresql://user:password@host:5432/db_name" | base64 -w 0
#
# 4. Encode Redis URL:
#    echo -n "redis://:password@redis:6379/0" | base64 -w 0
#
# 5. Encode API keys:
#    echo -n "your-api-key-here" | base64 -w 0
#
# 6. Apply secrets:
#    kubectl apply -f secrets.yaml
#
# 7. Verify secrets:
#    kubectl get secrets -n imanipay
#    kubectl describe secret imanipay-secrets -n imanipay
#
# Security Best Practices:
# - Never commit actual secrets to version control
# - Use external secret management systems in production
# - Rotate secrets regularly
# - Use RBAC to restrict access to secrets
# - Enable audit logging for secret access
# - Consider using sealed-secrets or external-secrets operator

