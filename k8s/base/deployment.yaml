# ImaniPay Blockchain Service - Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: imanipay-api
  namespace: imanipay
  labels:
    app.kubernetes.io/name: imanipay-blockchain-service
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: imanipay-platform
    app.kubernetes.io/version: "1.0.0"
  annotations:
    deployment.kubernetes.io/revision: "1"
    description: "ImaniPay Blockchain Service API deployment"
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: imanipay-blockchain-service
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: imanipay-blockchain-service
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: imanipay-platform
        app.kubernetes.io/version: "1.0.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: imanipay-service-account
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: api
        image: imanipay-blockchain-service:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        env:
        # Configuration from ConfigMap
        - name: APP_NAME
          valueFrom:
            configMapKeyRef:
              name: imanipay-config
              key: APP_NAME
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: imanipay-config
              key: ENVIRONMENT
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: imanipay-config
              key: LOG_LEVEL
        - name: UVICORN_WORKERS
          valueFrom:
            configMapKeyRef:
              name: imanipay-config
              key: UVICORN_WORKERS
        - name: DATABASE_POOL_SIZE
          valueFrom:
            configMapKeyRef:
              name: imanipay-config
              key: DATABASE_POOL_SIZE
        - name: REDIS_POOL_SIZE
          valueFrom:
            configMapKeyRef:
              name: imanipay-config
              key: REDIS_POOL_SIZE
        - name: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
          valueFrom:
            configMapKeyRef:
              name: imanipay-config
              key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        - name: PROMETHEUS_ENABLED
          valueFrom:
            configMapKeyRef:
              name: imanipay-config
              key: PROMETHEUS_ENABLED
        
        # Secrets
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: imanipay-secrets
              key: DATABASE_URL
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: imanipay-secrets
              key: JWT_SECRET_KEY
        - name: ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: imanipay-secrets
              key: ENCRYPTION_KEY
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: imanipay-secrets
              key: REDIS_URL
        - name: CIRCLE_API_KEY
          valueFrom:
            secretKeyRef:
              name: imanipay-secrets
              key: CIRCLE_API_KEY
        - name: SENDGRID_API_KEY
          valueFrom:
            secretKeyRef:
              name: imanipay-secrets
              key: SENDGRID_API_KEY
        
        # Kubernetes-specific environment variables
        - name: KUBERNETES_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: KUBERNETES_POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: KUBERNETES_NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        
        livenessProbe:
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
        
        startupProbe:
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 30
        
        volumeMounts:
        - name: app-logs
          mountPath: /app/logs
        - name: app-data
          mountPath: /app/data
        - name: tmp
          mountPath: /tmp
        
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
      
      volumes:
      - name: app-logs
        emptyDir: {}
      - name: app-data
        emptyDir: {}
      - name: tmp
        emptyDir: {}
      
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      
      # Node selection and affinity
      nodeSelector:
        kubernetes.io/os: linux
      
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                  - imanipay-blockchain-service
              topologyKey: kubernetes.io/hostname
      
      tolerations:
      - key: "node.kubernetes.io/not-ready"
        operator: "Exists"
        effect: "NoExecute"
        tolerationSeconds: 300
      - key: "node.kubernetes.io/unreachable"
        operator: "Exists"
        effect: "NoExecute"
        tolerationSeconds: 300

---
# Horizontal Pod Autoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: imanipay-api-hpa
  namespace: imanipay
  labels:
    app.kubernetes.io/name: imanipay-blockchain-service
    app.kubernetes.io/component: autoscaler
    app.kubernetes.io/part-of: imanipay-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: imanipay-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Max

---
# Pod Disruption Budget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: imanipay-api-pdb
  namespace: imanipay
  labels:
    app.kubernetes.io/name: imanipay-blockchain-service
    app.kubernetes.io/component: disruption-budget
    app.kubernetes.io/part-of: imanipay-platform
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: imanipay-blockchain-service
      app.kubernetes.io/component: api

